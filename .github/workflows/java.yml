name: java
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    container: eclipse-temurin:latest
    steps:
      - uses: actions/checkout@v4
      - run: javac -d out src/Main.java && java -cp out Main
  quality:
    runs-on: ubuntu-latest
    container: maven:latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@main
        continue-on-error: true
      - run: mvn --version
